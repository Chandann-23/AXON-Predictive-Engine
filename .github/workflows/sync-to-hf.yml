name: Sync Backend → Hugging Face Space

on:
  push:
    branches:
      - main

jobs:
  sync-to-hf:
    name: Push backend to HF Space
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push backend folder to Hugging Face Space
        run: |
          # Configure git identity
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"

          # Clone using explicit .git endpoint with hardcoded public paths
          git clone https://Chandann-23:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/Chandann-23/Axon-predictive-engine.git hf_space

          # Clear old content inside the space clone (keep .git tracking configuration)
          find hf_space -mindepth 1 -not -path 'hf_space/.git*' -delete

          # Copy backend folder contents into the space root directory
          cp -r backend/. hf_space/

          # Move into workspace, stage changes, and commit
          cd hf_space
          git add -A
          
          # Check if there are actual code changes to prevent empty commit errors
          if git diff --cached --quiet; then
            echo "No changes to sync."
            exit 0
          fi
          
          git commit -m "sync: auto-deploy from GitHub Actions ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          
          # Force push to overwrite remote history and clear fast-forward rejections
          git push --force https://Chandann-23:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/Chandann-23/Axon-predictive-engine.git main