name: Sync Backend → Hugging Face Space

on:
  push:
    branches:
      - main

jobs:
  sync-to-hf:
    name: Push backend to HF Space
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push backend folder to Hugging Face Space
        run: |
          # Configure git identity
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"

          # Clone using explicit secret values with fallbacks
          git clone https://${{ secrets.HF_USERNAME }}:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/Chandann-23/Axon-predictive-engine hf_space

          # Clear old content inside the clone directory (keep .git tracking configuration)
          find hf_space -mindepth 1 -not -path 'hf_space/.git*' -delete

          # Copy backend contents into the space root directory
          cp -r backend/. hf_space/

          # Move into workspace, stage changes, commit, and push
          cd hf_space
          git add -A
          
          # Check if there are actual code changes to prevent empty commit errors
          if git diff --cached --quiet; then
            echo "No changes to sync."
            exit 0
          fi
          
          git commit -m "sync: auto-deploy from GitHub Actions ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          
          # FORCE push to overwrite the remote history and bypass fast-forward rejections
          git push --force https://${{ secrets.HF_USERNAME }}:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/Chandann-23/Axon-predictive-engine main