name: Sync Backend → Hugging Face Space

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/sync-to-hf.yml"
  workflow_dispatch:

jobs:
  sync-to-hf:
    name: Push backend to HF Space
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push backend folder to Hugging Face Space
        env:
          # Token variations
          HF_TOKEN_1: ${{ secrets.HF_TOKEN }}
          HF_TOKEN_2: ${{ secrets.HFTOKEN }}
          HF_TOKEN_3: ${{ secrets.hftoken }}
          HF_TOKEN_4: ${{ secrets.HF_WRITE_TOKEN }}
          # Username variations
          HF_USERNAME_1: ${{ secrets.HF_USERNAME || vars.HF_USERNAME }}
          HF_USERNAME_2: ${{ secrets.HFUSERNAME || vars.HFUSERNAME }}
          HF_USERNAME_3: ${{ secrets.hfusername || vars.hfusername }}
          HF_USERNAME_4: ${{ secrets.USERNAME || vars.USERNAME }}
          HF_USERNAME_5: ${{ secrets.username || vars.username }}
          # Space Name variations
          HF_SPACE_NAME_1: ${{ secrets.HF_SPACE_NAME || vars.HF_SPACE_NAME }}
          HF_SPACE_NAME_2: ${{ secrets.HFSPACENAME || vars.HFSPACENAME }}
          HF_SPACE_NAME_3: ${{ secrets.hfspacename || vars.hfspacename }}
          HF_SPACE_NAME_4: ${{ secrets.SPACE_NAME || vars.SPACE_NAME }}
          HF_SPACE_NAME_5: ${{ secrets.spacename || vars.spacename }}
        run: |
          # Configure git identity
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"

          # Resolve token
          HF_TOKEN="${HF_TOKEN_1:-${HF_TOKEN_2:-${HF_TOKEN_3:-$HF_TOKEN_4}}}"

          # Resolve username
          USERNAME="${HF_USERNAME_1:-${HF_USERNAME_2:-${HF_USERNAME_3:-${HF_USERNAME_4:-${HF_USERNAME_5:-Chandann-23}}}}}"

          # Resolve space name
          SPACE_NAME="${HF_SPACE_NAME_1:-${HF_SPACE_NAME_2:-${HF_SPACE_NAME_3:-${HF_SPACE_NAME_4:-${HF_SPACE_NAME_5:-Axon-predictive-engine}}}}}"

          # Log which variables were successfully detected (without printing values)
          echo "=== Secrets & Variables Diagnostics ==="
          if [ -n "$HF_TOKEN_1" ]; then echo "✓ Detected secret: HF_TOKEN"; fi
          if [ -n "$HF_TOKEN_2" ]; then echo "✓ Detected secret: HFTOKEN"; fi
          if [ -n "$HF_TOKEN_3" ]; then echo "✓ Detected secret: hftoken"; fi
          if [ -n "$HF_TOKEN_4" ]; then echo "✓ Detected secret: HF_WRITE_TOKEN"; fi
          if [ -z "$HF_TOKEN" ]; then
            echo "❌ ERROR: No Hugging Face token secret was found under any supported names (HF_TOKEN, HFTOKEN, hftoken, HF_WRITE_TOKEN)."
            echo "Please add a repository secret in GitHub Settings > Secrets and variables > Actions."
            exit 1
          fi

          if [ -n "$HF_USERNAME_1" ]; then echo "✓ Detected: HF_USERNAME"; fi
          if [ -n "$HF_USERNAME_2" ]; then echo "✓ Detected: HFUSERNAME"; fi
          if [ -n "$HF_USERNAME_3" ]; then echo "✓ Detected: hfusername"; fi
          if [ -n "$HF_USERNAME_4" ]; then echo "✓ Detected: USERNAME"; fi
          if [ -n "$HF_USERNAME_5" ]; then echo "✓ Detected: username"; fi

          if [ -n "$HF_SPACE_NAME_1" ]; then echo "✓ Detected: HF_SPACE_NAME"; fi
          if [ -n "$HF_SPACE_NAME_2" ]; then echo "✓ Detected: HFSPACENAME"; fi
          if [ -n "$HF_SPACE_NAME_3" ]; then echo "✓ Detected: hfspacename"; fi
          if [ -n "$HF_SPACE_NAME_4" ]; then echo "✓ Detected: SPACE_NAME"; fi
          if [ -n "$HF_SPACE_NAME_5" ]; then echo "✓ Detected: spacename"; fi

          echo "Resolved Username: $USERNAME"
          echo "Resolved Space Name: $SPACE_NAME"
          echo "========================================"

          # Configure credential helper store (handles special characters in token securely)
          git config --global credential.helper store
          echo "https://$USERNAME:$HF_TOKEN@huggingface.co" > ~/.git-credentials

          # Instead of cloning (which fails if remote repo is completely empty with no default branch),
          # we initialize a new local repo and force-push. This is 100% reliable for both empty and non-empty spaces.
          echo "Initializing temporary repository for sync..."
          mkdir hf_sync_dir
          cd hf_sync_dir
          git init
          git lfs install
          git checkout -b main
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"

          # Copy backend files and root .gitignore
          cp -r ../backend/. .
          cp ../.gitignore .

          # Configure Git LFS tracking for binary model files (required by Hugging Face)
          git lfs track "models/*.pkl"

          # Stage all files (including LFS tracking configuration)
          git add -A

          # Commit
          git commit -m "sync: auto-deploy from GitHub Actions ($(date -u '+%Y-%m-%d %H:%M UTC'))"

          # Force-push to Hugging Face with retry logic for 429 rate limits
          echo "Pushing changes to Hugging Face Space..."
          
          MAX_ATTEMPTS=5
          ATTEMPT=1
          DELAY=10
          
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Push attempt $ATTEMPT of $MAX_ATTEMPTS..."
            if git push --force "https://huggingface.co/spaces/$USERNAME/$SPACE_NAME" main 2>push_err.log; then
              echo "Successfully pushed!"
              break
            else
              # Check if the error is a 429 Rate Limit
              if grep -q "429" push_err.log; then
                echo "WARNING: Hit rate limit (HTTP 429). Retrying in ${DELAY}s..."
                sleep $DELAY
                DELAY=$((DELAY * 2)) # Exponential backoff
                ATTEMPT=$((ATTEMPT + 1))
              else
                echo "ERROR: Failed to push to Hugging Face Space."
                # Mask token in error log
                cat push_err.log | sed "s/$HF_TOKEN/***TOKEN***/g"
                rm -f ~/.git-credentials
                exit 1
              fi
            fi
          done

          if [ $ATTEMPT -gt $MAX_ATTEMPTS ]; then
            echo "ERROR: Failed to push after $MAX_ATTEMPTS attempts due to Hugging Face rate limiting (HTTP 429)."
            cat push_err.log | sed "s/$HF_TOKEN/***TOKEN***/g"
            rm -f ~/.git-credentials
            exit 1
          fi

          # Clean up credentials
          rm -f ~/.git-credentials
          echo "Successfully synced to Hugging Face Space!"