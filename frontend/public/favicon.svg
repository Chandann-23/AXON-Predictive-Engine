<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Dark background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#080a0f"/>
    </linearGradient>
    <!-- Cyan glow gradient for the pulse line -->
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0"/>
      <stop offset="40%" stop-color="#00d4ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00b4db" stop-opacity="1"/>
    </linearGradient>
    <!-- Hex node gradient -->
    <linearGradient id="hex" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.04"/>
    </linearGradient>
    <!-- Outer glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Subtle border glow -->
  <rect width="32" height="32" rx="7" fill="none" stroke="#00d4ff" stroke-width="0.6" stroke-opacity="0.25"/>

  <!-- Center hexagon node (AI brain cell) -->
  <!-- Hex centered at 16,16 with radius ~7 -->
  <polygon
    points="16,9 22,12.5 22,19.5 16,23 10,19.5 10,12.5"
    fill="url(#hex)"
    stroke="#00d4ff"
    stroke-width="0.9"
    stroke-opacity="0.7"
    filter="url(#glow)"
  />

  <!-- Inner smaller hex (double ring effect) -->
  <polygon
    points="16,12 19.5,14 19.5,18 16,20 12.5,18 12.5,14"
    fill="none"
    stroke="#00d4ff"
    stroke-width="0.5"
    stroke-opacity="0.35"
  />

  <!-- Center dot — prediction nucleus -->
  <circle cx="16" cy="16" r="2" fill="#00d4ff" filter="url(#glow)" opacity="0.95"/>

  <!-- Pulse / ECG line across the icon -->
  <!-- Flat → spike up → spike down → flat (heartbeat / system pulse) -->
  <polyline
    points="2,21 7,21 9,21 10.5,17 12,24 13.5,14 15,21 30,21"
    fill="none"
    stroke="url(#pulse)"
    stroke-width="1.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
    opacity="0.85"
  />

  <!-- Three connector nodes on hex vertices (top-right, bottom-right, left) -->
  <circle cx="22" cy="12.5" r="1.2" fill="#00d4ff" opacity="0.6"/>
  <circle cx="22" cy="19.5" r="1.2" fill="#00d4ff" opacity="0.6"/>
  <circle cx="10"  cy="16"  r="1.2" fill="#00d4ff" opacity="0.4"/>

  <!-- "A" lettermark subtly inside hex (optional, very small) -->
  <!-- Skipping text to keep favicon crisp at 16x16 browser size -->
</svg>